<!DOCTYPE html>
<html>
<head>
    <title>Login - Attendance Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
        }
        
        h2 {
            color: #333;
            margin-bottom: 25px;
            text-align: center;
            font-size: 24px;
        }
        
        .role-selector {
            margin-bottom: 25px;
        }
        
        .role-selector label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .role-selector select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.3s;
            background: white;
        }
        
        .role-selector select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
        
        button[type="submit"],
        button[type="reset"] {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button[type="submit"] {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        button[type="reset"] {
            background: #f8f9fa;
            color: #666;
            border: 2px solid #e0e0e0;
        }
        
        button[type="reset"]:hover {
            background: #e9ecef;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        
        {% if error %}
        <div style="background: #f8d7da; color: #721c24; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center;">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="/login/?role={{ role }}">
            {% csrf_token %}
            
            <div class="role-selector">
                <label for="role">Select Role</label>
                <select name="role" id="role" onchange="window.location.href='/login/?role='+this.value">
                    <option value="student" {% if role == 'student' %}selected{% endif %}>Student</option>
                    <option value="teacher" {% if role == 'teacher' %}selected{% endif %}>Teacher</option>
                    <option value="admin" {% if role == 'admin' %}selected{% endif %}>Admin</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" name="name" id="name" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required>
            </div>
            
            <div class="btn-group">
                <button type="submit">Login</button>
                <button type="reset">Reset</button>
            </div>
        </form>
        
        <script>
            function updateAction() {
                var role = document.getElementById('role').value;
                var form = document.querySelector('form');
                form.action = '/login/?role=' + role;
            }
            // Set initial action
            updateAction();
        </script>
    </div>
</body>
</html>
